services:
  - type: web
    name: tathya-df-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: TATHYA_DATA_DIR
        value: /tmp/data
      - key: CORS_ORIGINS
        sync: false
